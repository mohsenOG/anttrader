# Confirmed market data and grid parameters.
symbol: XAU/USD
timeframe: 1H
data_source: Dukascopy
historical_csv: data/xauusd_h1_bid.csv
timestamp_timezone: UTC
timestamp_format: ISO8601
candle_timestamp: open
quote_side: bid
drop_zero_volume: true
lookback_returns: 256
grid_size: [16, 16]
encoding: binary_log_return_sign
layout: serpentine

# Approved Topic 3 simulation; one independent ant per historical window.
simulation:
  steps: 2048
  start_row: 15
  start_col: 0
  initial_direction: north
  boundary: toroidal
  checkpoints: [256, 512, 1024, 2048]
  ants: 1
  reset_each_window: true
feature_output: results/ant_features.csv

# Historical signal research; the horizon is used only for forecast labels.
decoder: logistic_regression
prediction_horizon_bars: 4
standard_scaler: true
random_state: 42
logistic_regression:
  C: 1.0
  solver: lbfgs
  max_iter: 1000
buy_threshold: 0.55
sell_threshold: 0.45
train_fraction: 0.60
validation_fraction: 0.20
test_fraction: 0.20
momentum_lookback_bars: 4
signal_output: results/signals.csv
metrics_output: results/metrics.json
experiment_metadata_output: results/experiment.metadata.json
